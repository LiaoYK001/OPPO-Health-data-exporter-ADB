[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ohealth-data-exporter"
version = "0.2.0"
description = "Root database and ADB evidence exporter for OPPO Health"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "openpyxl>=3.1",
  "Pillow>=11.0",
]

[project.optional-dependencies]
frida = [
  "frida>=17.9.11,<18",
]

[project.scripts]
ohealth-exporter = "health_exporter.cli:main"

[tool.setuptools.packages.find]
include = ["health_exporter*"]

[tool.setuptools.package-data]
health_exporter = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
