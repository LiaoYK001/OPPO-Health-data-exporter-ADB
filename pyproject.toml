[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ohealth-data-exporter"
version = "0.3.0"
description = "Local multi-vendor health archive, normalization, evidence export and web app"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/*"]
keywords = ["health-data", "sqlite", "adb", "wearables", "data-portability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "Pillow>=11.0,<13",
  "tzdata>=2025.2; platform_system == 'Windows'",
  "uvicorn>=0.32,<1",
]

[project.urls]
Homepage = "https://github.com/LiaoYK001/OPPO-Health-data-exporter-ADB"
Repository = "https://github.com/LiaoYK001/OPPO-Health-data-exporter-ADB"
Issues = "https://github.com/LiaoYK001/OPPO-Health-data-exporter-ADB/issues"
Security = "https://github.com/LiaoYK001/OPPO-Health-data-exporter-ADB/security/advisories/new"

[project.optional-dependencies]
frida = [
  "frida>=17.9.11,<18",
]
dev = [
  "bandit>=1.9,<2",
  "build>=1.3,<2",
  "httpx>=0.27,<1",
  "pip-audit>=2.10,<3",
  "pytest>=8,<10",
  "ruff>=0.12,<0.18",
]

[project.scripts]
ohealth-exporter = "health_exporter.cli:main"

[tool.setuptools.packages.find]
include = ["health_exporter*"]

[tool.setuptools.package-data]
health_exporter = [
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web_dist/*.html",
  "web_dist/*.png",
  "web_dist/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
