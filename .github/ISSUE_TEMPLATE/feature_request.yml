name: Feature request
description: 提议厂商适配、数据模型、展示或工程改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案与数据契约影响
      description: 说明来源、保真、跨厂商语义、迁移和兼容性；不要附真实数据。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 内容只使用合成示例，不含真实健康数据、身份信息、凭据或本机用户路径。
          required: true
