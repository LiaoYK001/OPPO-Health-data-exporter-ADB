name: Bug report
description: 报告可复现的软件问题（不得上传真实健康数据）
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先最小化并去敏。不要附加数据库、截图、日志全文、账号/设备标识、口令、盐或绝对用户目录。安全漏洞请使用私下报告渠道。
  - type: input
    id: version
    attributes:
      label: 项目版本或提交
      placeholder: commit SHA 或版本号
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 模块
      options:
        - 采集 / ADB
        - 数据库 / 规范化
        - 导出 / 验真
        - Web / API
        - 文档 / 安装
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用合成数据描述最小复现。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Python、Windows、MuMu 和 APP 版本；删除用户名和设备标识。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已运行公开发布检查，并人工确认内容不含真实健康数据、身份信息、凭据或本机用户路径。
          required: true
        - label: 这不是需要私下报告的安全漏洞。
          required: true
