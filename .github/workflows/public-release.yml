name: Public release gate

on:
  workflow_dispatch:
    inputs:
      include_history:
        description: "同时执行可选的完整 Git 历史盘点"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  current-tree-and-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python scripts/public_release_check.py

  optional-history-audit:
    if: ${{ inputs.include_history }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python scripts/public_release_check.py --history
